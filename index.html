<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Notas Académicas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Sección 1: Formulario de Control de Notas -->
        <div class="container">
            <h2>CONTROL DE NOTAS</h2>
            
            <form id="notasForm">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="nie">NIE:</label>
                    <input type="text" id="nie" required>
                </div>

                <div class="form-group">
                    <label for="nota1">Nota 1:</label>
                    <input type="number" step="0.01" id="nota1" required>
                </div>

                <div class="form-group">
                    <label for="nota2">Nota 2:</label>
                    <input type="number" step="0.01" id="nota2" required>
                </div>

                <div class="form-group">
                    <label for="nota3">Nota 3:</label>
                    <input type="number" step="0.01" id="nota3" required>
                </div>

                <div class="form-group">
                    <label for="examen">Examen:</label>
                    <input type="number" step="0.01" id="examen" required>
                </div>

                <button type="submit">CALCULAR Y GUARDAR</button>
            </form>

            <div id="mensaje" style="display: none;"></div>
            
            <div id="resultado" class="resultado-card" style="display: none;">
                <h3>Resultado del Estudiante:</h3>
                <p><strong>ESTUDIANTE:</strong> <span id="resNombre"></span></p>
                <p><strong>NIE:</strong> <span id="resNie"></span></p>
                <p><strong>Promedio:</strong> <span id="resPromedio"></span></p>
                <p><strong>Resultado:</strong> <span id="resClasificacion"></span></p>
            </div>
        </div>

        <!-- Sección 2: Consulta del Archivo TXT -->
        <div class="container">
            <h2>CONSULTAR NOTAS</h2>
            
            <div class="form-group">
                <label for="archivoInput">Seleccionar notas.txt:</label>
                <input type="file" id="archivoInput" accept=".txt">
            </div>

            <button type="button" id="btnConsultar">MOSTRAR REGISTROS</button>

            <div id="estadisticas" class="stats-card" style="display: none;">
                <p><strong>Total de estudiantes:</strong> <span id="totalEstudiantes">0</span></p>
                <p><strong>Aprobados:</strong> <span id="totalAprobados">0</span></p>
                <p><strong>Reprobados:</strong> <span id="totalReprobados">0</span></p>
            </div>

            <div id="tablaContainer" style="overflow-x: auto; margin-top: 15px;">
                <table id="tablaRegistros" style="width: 100%; border-collapse: collapse; display: none;">
                    <thead>
                        <tr style="background-color: #007BFF; color: white;">
                            <th style="padding: 8px; border: 1px solid #ddd;">NIE</th>
                            <th style="padding: 8px; border: 1px solid #ddd;">Estudiante</th>
                            <th style="padding: 8px; border: 1px solid #ddd;">Promedio</th>
                            <th style="padding: 8px; border: 1px solid #ddd;">Resultado</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
